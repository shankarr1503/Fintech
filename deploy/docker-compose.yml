# Production-shaped local stack: TLS 1.3 proxy -> API (2 replicas) -> MongoDB.
# Secrets come from deploy/.env (see deploy/.env.example); never commit real values.
# `${VAR:?}` makes `docker compose up` stop with an error when a secret is missing.
services:
  mongo:
    image: mongo:7.0.14
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes: [mongo-data:/data/db]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    deploy: { replicas: 2 }
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: coinquest
      DEMO_MODE: "false"
      REQUIRE_HTTPS: "true"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      PUSH_ENABLED: "true"
    depends_on:
      mongo: { condition: service_healthy }
    # Not published: only the proxy can reach it, which is why the Dockerfile's
    # --forwarded-allow-ips "*" is safe (clients can't set X-Forwarded-For themselves).
    networks: [internal]

  proxy:
    image: nginx:1.27.5-alpine
    ports: ["443:443", "80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

networks:
  internal: {}

volumes:
  mongo-data: {}
